    border:0;border-radius:40px;cursor:pointer;font:inherit;font-weight:800;color:#fff;font-size:clamp(30px,7vmin,60px);line-height:1.15;
    background:linear-gradient(135deg,#ff7a1a,#9a3df0);

  #chat:hover{transform:scale(1.03);box-shadow:0 26px 80px rgba(255,110,20,.5),0 16px 60px rgba(154,61,240,.5)}

<button id="chat" type="button">Click to start chatting</button>
<script>
(function(){
  var CHAT_URL = 'https://raw.githubusercontent.com/jace01b-web/itsukis-chat-hub-obfuscated/refs/heads/main/index.html';
  var CACHE_KEY = 'ich.chatCache';
  var TIMEOUT_MS = 12000;
  var btn = document.getElementById('chat');
  var busy = false;
  function run(html){ document.open(); document.write(html); document.close(); }
  function fromCache(){
    try { var c = localStorage.getItem(CACHE_KEY); if (c && c.indexOf('<') !== -1){ run(c); return true; } } catch(_){}
    return false;
  }
  btn.onclick = function(){
    if (busy) return;
    busy = true; btn.disabled = true; btn.textContent = 'Loading...';
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, TIMEOUT_MS);
    fetch(CHAT_URL + '?v=' + Date.now(), { cache:'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function(html){
        clearTimeout(timer);
        if (html.indexOf('<') === -1) throw new Error('Unexpected response');
        try { localStorage.setItem(CACHE_KEY, html); } catch(_){}
        run(html);
      })
      .catch(function(){
        clearTimeout(timer);
        if (!fromCache()){ busy = false; btn.disabled = false; btn.textContent = "Couldn't load — tap to try again"; }
      });
  };
})();
<\/script>

        /* ===== CUSTOM (USER-ADDED) MOVIES ===== */
        let customMovieList = [];
        function loadCustomMovies() {
            try { customMovieList = JSON.parse(localStorage.getItem('clu_custom_movies')) || []; }
            catch (e) { customMovieList = []; }
        }
        function saveCustomMovies() { localStorage.setItem('clu_custom_movies', JSON.stringify(customMovieList)); }
        function populateGenreSelect() {
            const sel = document.getElementById('addMovieGenre');
            if (!sel) return;
            sel.innerHTML = '';
            movieSections.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = s.icon + '  ' + s.title;
                sel.appendChild(opt);
            });
        }
        function addCustomMovie() {
            const nameInput = document.getElementById('addMovieName');
            const urlInput = document.getElementById('addMovieUrl');
            const genreSel = document.getElementById('addMovieGenre');
            const name = nameInput ? nameInput.value.trim() : '';
            let url = urlInput ? urlInput.value.trim() : '';
            const genre = genreSel ? genreSel.value : 'featured';
            if (!name || !url) { showToast('Please enter both the movie name and the link!'); return; }
            if (/^[a-zA-Z0-9_-]{20,}$/.test(url)) { url = 'https://drive.google.com/file/d/' + url + '/view'; }
            else if (!/^https?:\/\//i.test(url)) { url = 'https://' + url; }
            customMovieList.push({ name: name, url: url, genre: genre });
            saveCustomMovies();
            if (nameInput) nameInput.value = '';
            if (urlInput) urlInput.value = '';
            renderMoviesCatalog();
            showToast('🎬 Movie added: ' + name);
        }
        function removeCustomMovie(index, e) {
            if (e) { e.stopPropagation(); e.preventDefault(); }
            customMovieList.splice(index, 1);
            saveCustomMovies();
            renderMoviesCatalog();
            showToast('Movie removed.');
        }

        /* ===== URL HELPERS ===== */
        function resolveMovieUrl(u) {
            if (/^https?:/i.test(u)) return u;
            if (u.indexOf('f:') === 0) return 'https://drive.google.com/drive/folders/' + u.slice(2);
            return 'https://drive.google.com/file/d/' + u + '/view';
        }
        function getDriveFileId(url) {
            let m = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (m) return m[1];
            m = url.match(/drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/);
            if (m) return m[1];
            return null;
        }
        function getDriveFolderId(url) {
            if (/folderview/.test(url)) {
                const m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (m) return m[1];
            }
            const m = url.match(/drive\.google\.com\/folders\/([a-zA-Z0-9_-]+)/);
            return m ? m[1] : null;
        }
        function toEmbedUrl(url) {
            const fid = getDriveFileId(url);
            if (fid) {
                const t = url.match(/[?&]t=(\d+)/);
                const rk = url.match(/resourcekey=([a-zA-Z0-9_-]+)/);
                const q = [];
                if (rk) q.push('resourcekey=' + rk[1]);
                if (t) q.push('t=' + t[1]);
                return 'https://drive.google.com/file/d/' + fid + '/preview' + (q.length ? '?' + q.join('&') : '');
            }
            const fl = getDriveFolderId(url);
            if (fl) {
                const rk = url.match(/resourcekey=([a-zA-Z0-9_-]+)/);
                return 'https://drive.google.com/embeddedfolderview?id=' + fl + (rk ? '&resourcekey=' + rk[1] : '') + '#grid';
            }
            return url;
        }
        function openDirectLink(url) {
            const newTab = window.open('about:blank', '_blank');
            if (newTab) {
                try { newTab.location.replace(url); }
                catch (err) { newTab.location.href = url; }
            } else {
                showToast('⚠️ Pop-up blocked! Allow pop-ups to open direct links.');
            }
        }
        function openMovie(movie) {
            recordRecent(movie.title, movie.url, 'movie');
            openViewer(toEmbedUrl(movie.url), movie.title, movie.url);
        }

        /* ===== MOVIE RENDERING ===== */
        function renderMovieCard(grid, item, query) {
            if (query && item.title.toLowerCase().indexOf(query) === -1) return 0;
            const card = document.createElement('div');
            card.className = 'movie-card';
            const ts = document.createElement('span');
            ts.textContent = item.title;
            card.appendChild(ts);
            if (item.rating) {
                const r = document.createElement('span');
                r.className = 'rating-pill';
                r.textContent = '★ ' + item.rating;
                card.appendChild(r);
            }
            const direct = document.createElement('button');
            direct.className = 'movie-direct-btn';
            direct.title = 'Open direct in about:blank tab';
            direct.textContent = '↗';
            direct.onclick = (e) => { e.stopPropagation(); openDirectLink(item.url); };
            card.appendChild(direct);
            if (item.custom) {
                const rm = document.createElement('button');
                rm.className = 'movie-remove-btn';
                rm.title = 'Remove this movie';
                rm.textContent = '✕';
                rm.onclick = (e) => { e.stopPropagation(); removeCustomMovie(item.ci, e); };
                card.appendChild(rm);
            }
            card.onclick = () => openMovie(item);
            grid.appendChild(card);
            return 1;
        }
        function renderMoviesCatalog() {
            const container = document.getElementById('moviesSections');
            if (!container) return;
            const input = document.getElementById('movieSearchInput');
            const query = input ? input.value.toLowerCase().trim() : '';
            const clearBtn = document.getElementById('clear-btn');
            if (clearBtn) clearBtn.style.display = query ? 'block' : 'none';
            container.innerHTML = '';
            let anyVisible = false;
            let totalCount = 0;
            movieSections.forEach(sec => {
                totalCount += sec.items.length;
                const sectionEl = document.createElement('section');
                sectionEl.className = 'space-y-3';
                sectionEl.id = 'moviesec-' + sec.id;
                const header = document.createElement('h2');
                header.className = 'movie-section-header';
                header.textContent = sec.icon + '  ' + sec.title + '  (' + sec.items.length + ')';
                sectionEl.appendChild(header);
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3';
                let visible = 0;
                sec.items.forEach(it => {
                    visible += renderMovieCard(grid, { title: it[0], url: resolveMovieUrl(it[1]), rating: it[2] }, query);
                });
                customMovieList.forEach((c, i) => {
                    const gid = movieSections.some(s => s.id === c.genre) ? c.genre : 'featured';
                    if (gid !== sec.id) return;
                    totalCount += 1;
                    visible += renderMovieCard(grid, { title: c.name, url: c.url, rating: null, custom: true, ci: i }, query);
                });
                if (query && visible === 0) sectionEl.style.display = 'none';
                else anyVisible = true;
                sectionEl.appendChild(grid);
                container.appendChild(sectionEl);
            });
            const mc = document.getElementById('movieCountBadge');
            if (mc) mc.textContent = totalCount + ' titles';
            const empty = document.getElementById('moviesEmpty');
            if (empty) empty.classList.toggle('hidden', !(query && !anyVisible));
        }
        function filterMoviesCatalog() { renderMoviesCatalog(); }
        function clearMovieSearch() {
            const input = document.getElementById('movieSearchInput');
            if (input) input.value = '';
            renderMoviesCatalog();
        }

        let fileGamesDB = null;
        function openFileGamesDB() {
            return new Promise(resolve => {
                try {
                    const rq = indexedDB.open('clu_file_games_db', 1);
                    rq.onupgradeneeded = (e) => { e.target.result.createObjectStore('games', { keyPath: 'id', autoIncrement: true }); };
                    rq.onsuccess = (e) => { fileGamesDB = e.target.result; resolve(); };
                    rq.onerror = () => resolve();
                } catch (err) { resolve(); }
            });
        }
        function saveFileGame(name, blob) {
            return new Promise(resolve => {
                if (!fileGamesDB) return resolve();
                try {
                    const tx = fileGamesDB.transaction('games', 'readwrite');
                    tx.objectStore('games').put({ name: name, blob: blob, added: Date.now() });
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => resolve();
                } catch (err) { resolve(); }
            });
        }
        function getAllFileGames() {
            return new Promise(resolve => {
                if (!fileGamesDB) return resolve([]);
                try {
                    const rq = fileGamesDB.transaction('games').objectStore('games').getAll();
                    rq.onsuccess = () => resolve(rq.result || []);
                    rq.onerror = () => resolve([]);
                } catch (err) { resolve([]); }
            });
        }
        function deleteFileGame(id) {
            return new Promise(resolve => {
                if (!fileGamesDB) return resolve();
                try {
                    const tx = fileGamesDB.transaction('games', 'readwrite');

                    tx.oncomplete = () => resolve();
                    tx.onerror = () => resolve();
                } catch (err) { resolve(); }

        /* ===== GAME URL EXTRACTION + 🏠 FOR REGULAR GAMES ===== */
        function extractGameUrl(btn) {
            try {
                const oc = (btn.getAttribute && btn.getAttribute('onclick')) || '';
                if (oc) {
                    let m = oc.match(/['"](https?:\/\/[^'"]+)['"]/i);
                    if (m) return m[1];
                    m = oc.match(/(https?:\/\/[^\s'")]+)/i);
                    if (m) return m[0];
                }
                const attrs = ['data-url', 'data-href', 'data-link', 'data-src'];
                for (let i = 0; i < attrs.length; i++) {
                    const v = btn.getAttribute && btn.getAttribute(attrs[i]);
                    if (v && /^https?:\/\//i.test(v)) return v;
                }
                if (btn.closest) {
                    const a = btn.closest('a[href]');
                    if (a && /^https?:/i.test(a.protocol || '')) return a.href;
                }
                if (btn.parentElement) {
                    const sib = btn.parentElement.querySelector('a[href^="http"]');
                    if (sib) return sib.href;
                }
            } catch (e) {}
            return null;
        }

                    totalTimeSeconds += gained;
                    lastTick = now;
                    localStorage.setItem('clu_user_time_seconds', totalTimeSeconds);

                const lvl = getLevelInfo(totalTimeSeconds).level;
                if (lvl >= 30 && lastLevelSeen < 30) showToast('🛡️ LEVEL 30 — PROXIES TAB UNLOCKED!');

            let title = 'Novice';
            if (level >= 30) { badge = '🛡️'; title = 'Proxy Master'; }
            else if (level >= 25) { badge = '⚡'; title = 'Cyber Legend'; }

            else if (level >= 10) { badge = '👾'; title = 'CRT Hacker'; }

            return { level, minutes, seconds, progress, badge, title };

        /* ===== THEMES ===== */
        function applyTheme(themeObj) {
            activeTheme = { ...themeObj };
            const root = document.documentElement;
            stopRgbBorderAnimation();
            SPECIAL_THEME_CLASSES.forEach(cls => document.body.classList.remove(cls));
            if (themeObj.special) document.body.classList.add(`theme-${themeObj.special}`);
            const hex = themeObj.accent.replace('#', '');
            const parsedR = parseInt(hex.substring(0, 2), 16);
            const parsedG = parseInt(hex.substring(2, 4), 16);
            const parsedB = parseInt(hex.substring(4, 6), 16);
            const r = isNaN(parsedR) ? 255 : parsedR;
            const g = isNaN(parsedG) ? 102 : parsedG;
            const b = isNaN(parsedB) ? 0 : parsedB;
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            const accentTextColor = brightness > 128 ? '#000000' : '#ffffff';
            root.style.setProperty('--accent-orange', themeObj.accent);
            root.style.setProperty('--accent-orange-hover', themeObj.hover || themeObj.accent);
            root.style.setProperty('--accent-glow', `rgba(${r}, ${g}, ${b}, 0.4)`);
            root.style.setProperty('--bg-color', themeObj.bg);
            root.style.setProperty('--card-bg', themeObj.card);
            root.style.setProperty('--text-color', themeObj.text);
            root.style.setProperty('--accent-text-color', accentTextColor);
            root.style.setProperty('--border-color', `rgba(${r}, ${g}, ${b}, 0.35)`);
            if (themeObj.borderColor) root.style.setProperty('--border-color', themeObj.borderColor);
            const titleBrand = themeObj.titleText || 'CLU';
            const badgeBrand = themeObj.badgeText || 'CV';
            const brandHeading = document.getElementById('brandHeading');
            const headerBadge = document.getElementById('headerBadge');
            const loaderTitle = document.getElementById('loaderTitle');
            const authLogoBadge = document.getElementById('authLogoBadge');
            const authTitle = document.getElementById('authTitle');
            if (brandHeading) brandHeading.innerHTML = `${titleBrand} <span class="dynamic-accent">VAULT</span>`;
            if (headerBadge) headerBadge.textContent = badgeBrand;
            if (loaderTitle) loaderTitle.innerHTML = `${titleBrand}<span class="dynamic-accent">VAULT</span>`;
            if (authLogoBadge) authLogoBadge.textContent = badgeBrand;
            if (authTitle) authTitle.innerHTML = `${titleBrand} <span class="dynamic-accent">VAULT</span>`;
            document.getElementById('pickerAccent').value = themeObj.accent;
            document.getElementById('textAccent').value = themeObj.accent;
            document.getElementById('pickerAccentHover').value = themeObj.hover || themeObj.accent;
            document.getElementById('textAccentHover').value = themeObj.hover || themeObj.accent;
            document.getElementById('pickerBg').value = themeObj.bg;
            document.getElementById('textBg').value = themeObj.bg;
            document.getElementById('pickerCard').value = themeObj.card;
            document.getElementById('textCard').value = themeObj.card;
            document.getElementById('pickerText').value = themeObj.text;
            document.getElementById('textText').value = themeObj.text;
            localStorage.setItem('clu_theme_config', JSON.stringify(activeTheme));
            if (themeObj.special === 'rgb') startRgbBorderAnimation();
        }

        function sanitizeGameTitles() {
            const buttons = document.querySelectorAll(
                '#sections-container input[type="button"], #sections-container button:not(.fav-star-btn):not(.game-home-btn):not(.gn-game-btn):not(.gn-direct-btn), .buttons-container input[type="button"], .buttons-container button:not(.fav-star-btn):not(.game-home-btn):not(.gn-game-btn):not(.gn-direct-btn)'
            );
            buttons.forEach(btn => {
                if (btn.value && /^cl/i.test(btn.value.trim())) btn.value = btn.value.trim().replace(/^cl/i, '');
                else if (btn.textContent && /^cl/i.test(btn.textContent.trim())) btn.textContent = btn.textContent.trim().replace(/^cl/i, '');
            });
        }
        function filterGamesCatalog() {
            const input = document.getElementById('gameSearchInput');
            const q = input ? input.value.toLowerCase().trim() : '';
            const sections = document.querySelectorAll('.letter-section');
            sections.forEach(section => {
                const buttons = section.querySelectorAll('input[type="button"]:not(.fav-star-btn), .buttons-container button:not(.fav-star-btn):not(.game-home-btn):not(.gn-direct-btn)');
                let visibleCount = 0;
                buttons.forEach(btn => {
                    const title = (btn.value || btn.textContent || '').trim();
                    const wrapper = btn.closest('.game-card-wrapper') || btn;
                    const matchesSearch = q === '' || title.toLowerCase().includes(q);
                    const matchesFav = !isGameFavFilterActive || userFavorites.has(title);
                    if (matchesSearch && matchesFav) { wrapper.style.display = ""; visibleCount++; }
                    else wrapper.style.display = "none";
                });
                section.style.display = visibleCount > 0 ? "" : "none";
            });
        }

                showToast(`Removed from Favorites: ${cleanTitle}`);
            } else {
                userFavorites.add(cleanTitle);
                showToast(`Saved to Favorites: ${cleanTitle}`);
            }
            const activeSession = localStorage.getItem('clu_active_session') || 'Guest';
            localStorage.setItem(`clu_game_favorites_${activeSession}`, JSON.stringify(Array.from(userFavorites)));
            updateFavoritesUI();

            const fallback = document.getElementById('gamesLoadingFallback');

            const badge = document.getElementById('favGameBadge');
            if (badge) badge.textContent = userFavorites.size;
            const buttons = document.querySelectorAll(
                'input[type="button"]:not(.fav-star-btn), .buttons-container button:not(.fav-star-btn):not(.game-home-btn):not(.gn-direct-btn)'
            );
            buttons.forEach(btn => {
                let title = (btn.value || btn.textContent || '').trim();
                if (!title || title === "Click to load if it isn't loading") return;
                const isGN = btn.classList.contains('gn-game-btn');
                let wrapper = btn.closest('.game-card-wrapper');
                if (!wrapper) {
                    wrapper = document.createElement('div');
                    wrapper.className = 'game-card-wrapper';
                    btn.parentNode.insertBefore(wrapper, btn);
                    wrapper.appendChild(btn);
                }
                let starBtn = wrapper.querySelector('.fav-star-btn');
                if (!starBtn) {
                    starBtn = document.createElement('button');
                    starBtn.className = 'fav-star-btn';
                    starBtn.type = 'button';
                    starBtn.onclick = (e) => toggleGameFavorite(title, e);
                    wrapper.appendChild(starBtn);
                }
                if (userFavorites.has(title)) {
                    starBtn.classList.add('is-favorite');
                    starBtn.innerHTML = '★';
                } else {
                    starBtn.classList.remove('is-favorite');
                    starBtn.innerHTML = '☆';
                }
                let homeBtn = wrapper.querySelector('.game-home-btn');
                if (!homeBtn) {
                    homeBtn = document.createElement('button');
                    homeBtn.className = 'game-home-btn';
                    homeBtn.type = 'button';
                    homeBtn.title = isGN ? 'Play inside the CLU Vault player' : 'Open this game direct in an about:blank tab';
                    homeBtn.textContent = '🏠';
                    homeBtn.onclick = (e) => {
                        if (isGN) {
                            if (e) { e.stopPropagation(); e.preventDefault(); }
                            const z = gnZones.find(zz => (zz.name || '').trim() === title);
                            if (z) { openGNMathZoneInVault(z); return; }
                            const u = btn.getAttribute('data-url');
                            if (u) { openViewer(u, title, u); return; }
                            showToast('⚠️ Could not resolve this game — reload the GN-Math section.');
                        } else {
                            openGameDirectBtn(btn, title, e);
                        }
                    };
                    wrapper.appendChild(homeBtn);
                }
                if (isGN) {
                    let dirBtn = wrapper.querySelector('.gn-direct-btn');
                    if (!dirBtn) {
                        dirBtn = document.createElement('button');
                        dirBtn.className = 'gn-direct-btn';
                        dirBtn.type = 'button';
                        dirBtn.title = 'Classic GN-Math launch in an about:blank tab';
                        dirBtn.textContent = '↗';
                        dirBtn.onclick = (e) => {
                            e.stopPropagation(); e.preventDefault();
                            const z = gnZones.find(zz => (zz.name || '').trim() === title);
                            if (z) { openGNMathZoneClassic(z); return; }
                            const u = btn.getAttribute('data-url');
                            if (u) openDirectLink(u);
                        };
                        wrapper.appendChild(dirBtn);
                    }
                }
            });
            renderPinnedFavoritesGrid();
        }
        function renderPinnedFavoritesGrid() {
            const container = document.getElementById('pinnedFavoritesContainer');
            const grid = document.getElementById('pinnedFavsGrid');
            if (!container || !grid) return;
            if (userFavorites.size === 0) { container.classList.add('hidden'); return; }
            container.classList.remove('hidden');
            grid.innerHTML = '';
            userFavorites.forEach(title => {
                const card = document.createElement('button');
                card.className = 'px-4 py-3 rounded-xl bg-black/60 border border-yellow-500/40 hover:border-yellow-400 font-bold text-xs text-white flex items-center justify-between group transition-all';
                card.innerHTML = `<span class="truncate">${title}</span><span class="text-yellow-400 group-hover:scale-125 transition-transform">★</span>`;
                card.onclick = () => {
                    const matchedBtn = Array.from(document.querySelectorAll('input[type="button"]:not(.fav-star-btn), .buttons-container button:not(.fav-star-btn):not(.game-home-btn):not(.gn-direct-btn)'))
                        .find(b => (b.value || b.textContent || '').trim() === title);
                    if (matchedBtn) matchedBtn.click();
                };
                grid.appendChild(card);
            });
        }
        function loadSavedFavorites() {
            try {
                const activeSession = localStorage.getItem('clu_active_session') || 'Guest';
                const saved = localStorage.getItem(`clu_game_favorites_${activeSession}`);
                if (saved) userFavorites = new Set(JSON.parse(saved));
            } catch (e) {}
            updateFavoritesUI();
        }

        /* ═══════════ 🎮 GN-MATH FUSION — v2 RELIABILITY LOADER ═══════════ */
        const GN_COVER_URL = "https://cdn.jsdelivr.net/gh/freebuisness/covers@main";
        const GN_HTML_URL  = "https://cdn.jsdelivr.net/gh/freebuisness/html@main";
        const GN_SITE_BASE = "https://cdn.jsdelivr.net/gh/freebuisness/gn-math-DONTDMCA@main/";
        const GN_ZONES_URLS = [
            "https://cdn.jsdelivr.net/gh/freebuisness/assets@main/zones.json",
            "https://fastly.jsdelivr.net/gh/freebuisness/assets@main/zones.json",
            "https://gcore.jsdelivr.net/gh/freebuisness/assets@main/zones.json",
            "https://cdn.jsdelivr.net/gh/freebuisness/assets@latest/zones.json",
            "https://cdn.jsdelivr.net/gh/freebuisness/assets@master/zones.json",
            "https://cdn.jsdelivr.net/gh/freebuisness/assets/zones.json",
            "https://raw.githubusercontent.com/freebuisness/assets/main/zones.json"
        ];
        let gnZones = [];
        function gnResolveUrl(u) { return (u || '').replace("{COVER_URL}", GN_COVER_URL).replace("{HTML_URL}", GN_HTML_URL); }
        function gnHasBase(html) { return /<base\b[^>]*\bhref\s*=/i.test(html); }
        function gnTryFetch(url, ms) {
            return new Promise((resolve, reject) => {
                const ctrl = new AbortController();
                const to = setTimeout(() => ctrl.abort(), ms || 8000);
                fetch(url + '?t=' + Date.now(), { cache: 'no-store', signal: ctrl.signal })
                    .then(r => { clearTimeout(to); if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
                    .then(t => resolve(t))
                    .catch(e => { clearTimeout(to); reject(e); });
            });
        }
        async function gnFetchZoneHtml(resolved) {
            let file = '';
            const pm = resolved.match(/html@main\/(.+)$/);
            if (pm) file = pm[1];
            const tries = [];
            if (file) {
                tries.push('https://cdn.jsdelivr.net/gh/freebuisness/html@main/' + file);
                tries.push('https://fastly.jsdelivr.net/gh/freebuisness/html@main/' + file);
                tries.push('https://gcore.jsdelivr.net/gh/freebuisness/html@main/' + file);
                tries.push('https://raw.githubusercontent.com/freebuisness/html/main/' + file);
            } else {
                tries.push(resolved);
            }
            for (let i = 0; i < tries.length; i++) {
                try { return await gnTryFetch(tries[i]); } catch (e) {}
            }
            return null;
        }
        function gnFixRelativeBase(html) {
            return html.replace(/<base\b([^>]*)\bhref\s*=\s*["']([^"']+)["']([^>]*)>/i, function (full, a, href, b) {
                if (/^(https?:|\/\/|data:)/i.test(href)) return full;
                try { return '<base' + a + 'href="' + new URL(href, GN_SITE_BASE).href + '"' + b + '>'; } catch (e) { return full; }
            });
        }
        function gnApplyBase(html, base) {
            if (!base) return html;
            if (/<head[^>]*>/i.test(html)) return html.replace(/<head([^>]*)>/i, '<head$1><base href="' + base + '">');
            return '<base href="' + base + '">' + html;
        }
        async function gnPickBase(html, zone) {
            if (gnHasBase(html)) return null;
            let ref = null;
            const m = html.match(/<(?:script|link|img|source|audio|video|embed)\b[^>]*\b(?:src|href)\s*=\s*["']([^"']+)["']/i);
            if (m) ref = m[1];
            const cands = [
                'https://cdn.jsdelivr.net/gh/freebuisness/gn-math-DONTDMCA@main/',
                'https://fastly.jsdelivr.net/gh/freebuisness/gn-math-DONTDMCA@main/',
                'https://cdn.jsdelivr.net/gh/freebuisness/html@main/'
            ];
            if (zone && zone.id != null) cands.push('https://cdn.jsdelivr.net/gh/freebuisness/html@main/' + zone.id + '/');
            if (ref && !/^(https?:|data:|blob:|\/\/)/i.test(ref)) {
                const probe = ref.replace(/^[./\\]+/, '').split(/[?#]/)[0];
                if (probe) {
                    for (let i = 0; i < cands.length; i++) {
                        const ctrl = new AbortController();
                        const to = setTimeout(() => ctrl.abort(), 5000);
                        try {
                            const r = await fetch(cands[i] + probe + '?t=' + Date.now(), { cache: 'no-store', signal: ctrl.signal });
                            clearTimeout(to);
                            if (r.ok) { try { if (r.body) r.body.cancel(); } catch (e2) {} return cands[i]; }
                            try { if (r.body) r.body.cancel(); } catch (e2) {}
                        } catch (e) { clearTimeout(to); }
                    }
                }
            }
            return cands[0];
        }
        function gnEmbedFallback(zone) {
            return (zone && zone.id != null) ? 'https://gn-math.github.io/?id=' + encodeURIComponent(zone.id) + '#embed' : null;
        }
        function gnEsc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function gnSplash(newWin, name) {
            try {
                newWin.document.open();
                newWin.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>' + gnEsc(name) + '</title><style>body{margin:0;background:#0a0a12;color:#7ea8ff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;height:100vh}h2{font-weight:800;letter-spacing:1px;margin:0}@keyframes gnspin{to{transform:rotate(360deg)}}.gnring{width:46px;height:46px;border:4px solid rgba(126,168,255,.2);border-top-color:#7ea8ff;border-radius:50%;animation:gnspin .8s linear infinite}</style></head><body><h2>⏳ ' + gnEsc(name) + '</h2><div class="gnring"></div></body></html>');
                newWin.document.close();
            } catch (e) {}
        }
        function gnWriteWin(newWin, html) {
            try {
                newWin.document.open();
                newWin.document.write(html);
                newWin.document.close();
                return true;
            } catch (e) { return false; }
        }
        async function openGNMathZone(zone) {
            const name = zone.name || 'GN-Math Game';
            if (/^https?:/i.test(zone.url || '')) { openDirectLink(zone.url); showToast('↗ Opened ' + name + ' in an about:blank tab'); return; }
            const resolved = gnResolveUrl(zone.url);
            recordRecent(name, resolved, 'game');
            let newWin = null;
            try { newWin = window.open('about:blank', '_blank'); } catch (e) {}
            if (!newWin) { showToast('⚠️ Pop-up blocked — opening ' + name + ' in the vault player instead.'); openGNMathZoneInVault(zone); return; }
            gnSplash(newWin, name);
            showToast('🎮 Launching ' + name + '…');
            const raw = await gnFetchZoneHtml(resolved);
            if (raw) {
                const base = await gnPickBase(raw, zone);
                if (gnWriteWin(newWin, gnApplyBase(gnFixRelativeBase(raw), base))) return;
            }
            const fb = gnEmbedFallback(zone);
            if (fb) { try { newWin.location.replace(fb); } catch (e) { newWin.location.href = fb; } showToast('⚠️ CDN unreachable — launched via GN-Math backup loader.'); }
            else { try { newWin.location.href = resolved; } catch (e) {} showToast('⚠️ Could not fetch this game.'); }
        }
        async function openGNMathZoneClassic(zone) {
            const name = zone.name || 'GN-Math Game';
            if (/^https?:/i.test(zone.url || '')) { openDirectLink(zone.url); return; }
            const resolved = gnResolveUrl(zone.url);
            let newWin = null;
            try { newWin = window.open('about:blank', '_blank'); } catch (e) {}
            if (!newWin) { showToast('⚠️ Pop-up blocked — opening in the vault player instead.'); openGNMathZoneInVault(zone); return; }
            gnSplash(newWin, name);
            const raw = await gnFetchZoneHtml(resolved);
            if (raw) {
                let html = gnFixRelativeBase(raw);
                if (!gnHasBase(html)) html = gnApplyBase(html, GN_SITE_BASE);
                if (gnWriteWin(newWin, html)) return;
            }
            const fb = gnEmbedFallback(zone);
            if (fb) { try { newWin.location.replace(fb); } catch (e) { newWin.location.href = fb; } showToast('⚠️ CDN unreachable — launched via GN-Math backup loader.'); }
            else { try { newWin.location.href = resolved; } catch (e) {} }
        }
        async function openGNMathZoneInVault(zone) {
            const name = zone.name || 'GN-Math Game';
            if (/^https?:/i.test(zone.url || '')) { openDirectLink(zone.url); return; }
            const resolved = gnResolveUrl(zone.url);
            recordRecent(name, resolved, 'game');
            showToast('🎮 Loading ' + name + ' inside the vault…');
            const raw = await gnFetchZoneHtml(resolved);
            if (raw) {
                const base = await gnPickBase(raw, zone);
                openViewer(URL.createObjectURL(new Blob([gnApplyBase(gnFixRelativeBase(raw), base)], { type: 'text/html' })), name, resolved);
                return;
            }
            const fb = gnEmbedFallback(zone);
            if (fb) { openViewer(fb, name, resolved); showToast('⚠️ CDN unreachable — using GN-Math backup loader.'); }
            else { openViewer(resolved, name, resolved); showToast('⚠️ Could not fetch — attempting the raw link.'); }
        }
        function installGNMathSection() {
            const anchor = document.getElementById('sections-container');
            if (!anchor || document.getElementById('gnMathContainer')) return;
            const wrap = document.createElement('div');
            wrap.id = 'gnMathContainer';
            wrap.className = 'letter-section';
            wrap.innerHTML = `
                <div class="flex items-center justify-between flex-wrap gap-2 mb-3" style="border-bottom:2px solid var(--accent-orange); padding-bottom:6px;">
                    <h3 class="text-xl font-bold font-orbitron text-white m-0">🎮 GN-MATH <span class="dynamic-accent">GAMES</span></h3>
                    <div class="flex items-center gap-2">
                        <span id="gnMathStatus" class="text-[10px] text-gray-400 font-bold"></span>
                        <button onclick="loadGNMathGames()" class="px-3 py-1.5 rounded-lg bg-black/60 border dynamic-border text-[11px] font-bold text-white hover:border-[var(--accent-orange)] transition-all">↻ Reload</button>
                    </div>
                </div>
                <div id="gnMathGrid" class="buttons-container"></div>
                <p class="text-[10px] text-gray-500 mt-3">Click a game = smart launch in an about:blank tab · ↗ = classic GN-Math launch · 🏠 = play inside the vault player · ★ = favorite.</p>`;
            anchor.parentNode.insertBefore(wrap, anchor);
        }
        async function loadGNMathGames() {
            installGNMathSection();
            const grid = document.getElementById('gnMathGrid');
            const status = document.getElementById('gnMathStatus');
            if (!grid) return;
            if (status) status.textContent = 'fetching catalog…';
            let json = null;
            for (let i = 0; i < GN_ZONES_URLS.length; i++) {
                try {
                    const r = await fetch(GN_ZONES_URLS[i] + '?t=' + Date.now(), { cache: 'no-store' });
                    if (!r.ok) continue;
                    const data = await r.json();
                    if (Array.isArray(data) && data.length) { json = data; break; }
                } catch (e) {}
            }
            if (!json) {
                if (status) status.textContent = '⚠️ unreachable — hit ↻ to retry';
                showToast('⚠️ GN-Math catalog unreachable right now.');
                return;
            }
            gnZones = json;
            renderGNMathGames();
        }
        function renderGNMathGames() {
            const grid = document.getElementById('gnMathGrid');
            const status = document.getElementById('gnMathStatus');
            if (!grid) return;
            grid.innerHTML = '';
            gnZones.slice().sort((a, b) => (a.name || '').localeCompare(b.name || '')).forEach(zone => {
                if (!zone || !zone.url) return;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'gn-game-btn';
                btn.textContent = zone.name || 'Unnamed Zone';
                btn.setAttribute('data-url', gnResolveUrl(zone.url));
                btn.title = 'Smart launch in an about:blank tab — 🏠 plays in the vault, ↗ classic launch';
                btn.onclick = () => openGNMathZone(zone);
                grid.appendChild(btn);
            });
            if (status) status.textContent = gnZones.length + ' games loaded';
            updateFavoritesUI();
        }

        /* ===== VIEWER + DIRECT TRACKING ===== */
        const overlay = document.getElementById('viewerOverlay');
        const frame = document.getElementById('viewerFrame');
        const loading = document.getElementById('viewerLoading');
        const statusEl = document.getElementById('viewerStatus');
        let currentDirectUrl = null;
        let frameSeenUrl = null;
        function openViewer(url, title = 'Vault Stream', directUrl = null) {
            currentDirectUrl = directUrl || url;
            frameSeenUrl = url;
            overlay.style.display = 'flex';
            statusEl.textContent = title;
            loading.style.display = 'flex';
            frame.src = url;
        }
        function closeViewer() {
            overlay.style.display = 'none';
            frame.src = 'about:blank';
            currentRotation = 0;
            currentDirectUrl = null;
            frameSeenUrl = null;
            document.getElementById('viewerFrameContainer').style.transform = 'rotate(0deg)';
        }
        function openDirectFromViewer() {
            const f = document.getElementById('viewerFrame');
            const url = currentDirectUrl || frameSeenUrl || (f && f.src && f.src !== 'about:blank' ? f.src : null);
            if (!url) { showToast('Nothing is open in the viewer right now.'); return; }
            openDirectLink(url);
            showToast('↗ Opened in an about:blank tab');
        }
        function clearAllData() {
            localStorage.clear();
            showToast('All local saved data cleared!');
            setTimeout(() => window.location.reload(), 1000);
        }
        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'bg-[#111115] border dynamic-border text-white px-4 py-2.5 rounded-xl font-bold text-xs shadow-2xl flex items-center gap-2 pointer-events-auto transition-all transform translate-y-2 opacity-0';
            toast.innerHTML = `<span>🎮</span> <span>${msg}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        document.getElementById('vBack').onclick = () => { try { frame.contentWindow.history.back(); } catch(e) {} };
        document.getElementById('vReload').onclick = () => { frame.src = frame.src; };
        document.getElementById('vHome').onclick = () => closeViewer();
        document.getElementById('vClose').onclick = closeViewer;
        frame.addEventListener('load', () => {
            loading.style.display = 'none';
            const s = frame.src;
            if (s && s !== 'about:blank') frameSeenUrl = s;
        });

        document.addEventListener('DOMContentLoaded', function() {
            try {
                initApp();
            } catch (err) {
                console.error('initApp failed:', err);
                try { showToast('⚠️ Startup error: ' + err.message); } catch (e2) {}
                dismissPageLoader();
            }
        });
        setTimeout(dismissPageLoader, 500);
    <\/script>
</body>
</html></script>

  <script>
    function launchInAboutBlank() {
      const newWin = window.open('about:blank', '_blank');

      if (!newWin) {
        alert('Pop-up blocked! Please allow pop-ups for this page and try again.');
        return;
      }

      const tabTitle = "school work";
      const tabIconUrl = "https://stargate.wcpss.net/files/wcpss_logo__keller_red_border.jpg";

      let portalCode = document.getElementById('portalTemplate').textContent;
      portalCode = portalCode.split('<\\/script>').join('<\/script>');

      portalCode = portalCode.split('__TABTITLE__').join(tabTitle);
      portalCode = portalCode.split('__TABICON__').join(tabIconUrl);

      let cascadeCode = document.getElementById('cascadeShell').textContent;
      cascadeCode = cascadeCode.split('<\\/script>').join('<\/script>');
      const cascadeJson = JSON.stringify(cascadeCode).replace(/<\//g, '<\\/');
      portalCode = portalCode.split('__CASCADE_JSON__').join(cascadeJson);

      let chatCode = document.getElementById('chatShell').textContent;
      chatCode = chatCode.split('<\\/script>').join('<\/script>');
      const chatJson = JSON.stringify(chatCode).replace(/<\//g, '<\\/');
      portalCode = portalCode.split('__CHAT_JSON__').join(chatJson);

      newWin.document.open();
      newWin.document.write(portalCode);
      newWin.document.close();
    }
  </script>
